<!-- @dsCard group="Type" viewport="700x220" name="Body & Label" subtitle="Inter — body copy, labels, captions for GoVehlo UI" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); background: #F7F9F8; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: baseline; gap: 16px; }
    .spec { font-size: 10px; color: #6B8F7A; white-space: nowrap; min-width: 120px; }
  </style>
</head>
<body>
  <div class="row">
    <span class="spec">15px · 400 · Body</span>
    <span style="font:400 15px/1.55 var(--font-body); color:#1A2E1F;">You owe Lars 52 kr for the trip on Monday. Split equally by km driven.</span>
  </div>
  <div class="row">
    <span class="spec">13px · 500 · Label</span>
    <span style="font:500 13px/1.4 var(--font-body); color:#3D5C48;">3 trips · 184 km · 15–21 jun</span>
  </div>
  <div class="row">
    <span class="spec">13px · 600 · Semibold</span>
    <span style="font:600 13px/1.4 var(--font-body); color:#1A2E1F;">52,00 kr · Paid · 3 members</span>
  </div>
  <div class="row">
    <span class="spec">11px · 400 · Caption</span>
    <span style="font:400 11px/1.4 var(--font-body); color:#6B8F7A;">Saved · 14:05 · Tap to view receipt</span>
  </div>
  <div style="height:1px; background:#E2EDE8; margin: 2px 0;"></div>
  <div class="row">
    <span class="spec">Inter weights</span>
    <span style="font:400 13px var(--font-body); color:#1A2E1F;">Regular&nbsp;&nbsp;</span>
    <span style="font:500 13px var(--font-body); color:#1A2E1F;">Medium&nbsp;&nbsp;</span>
    <span style="font:600 13px var(--font-body); color:#1A2E1F;">SemiBold</span>
  </div>
</body>
</html>
