<!-- @dsCard group="Foundations" viewport="700x300" name="Loading States" subtitle="Skeleton shimmer + Spinner — on-brand loading patterns" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../_ds_bundle.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F7F9F8; padding: 20px; font-family: var(--font-body); }
    h3 { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--text-primary); margin: 0 0 12px; }
    .hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.45; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Skeleton, Spinner, Button } = window.GoVehloDesignSystem_c5fd4e || {};

    function TripCardSkeleton() {
      return (
        <div style={{background:'#fff', borderRadius:16, padding:14, boxShadow:'0 1px 3px rgba(26,46,31,.07)', display:'flex', gap:12, alignItems:'center'}}>
          <Skeleton variant="circle" width={36} height={36} />
          <div style={{flex:1, display:'flex', flexDirection:'column', gap:6}}>
            <Skeleton variant="title" width="45%" />
            <Skeleton variant="line" width="75%" />
          </div>
          <Skeleton variant="button" width={56} height={22} radius={10} />
        </div>
      );
    }

    function App() {
      return (
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:24}}>
          {/* Left: Skeleton patterns */}
          <div>
            <h3>Skeleton loading</h3>
            <p style={{fontSize:12, color:'var(--text-muted)', marginBottom:14, lineHeight:1.45}}>
              Mist-green shimmer preserves brand feel while content loads. Compose card skeletons from primitives.
            </p>
            <div style={{display:'flex', flexDirection:'column', gap:8}}>
              <TripCardSkeleton />
              <TripCardSkeleton />
              <TripCardSkeleton />
            </div>
            <p className="hint">→ Skeleton variant="circle | title | line | card | button"</p>
          </div>

          {/* Right: Spinner patterns */}
          <div>
            <h3>Spinner indicators</h3>
            <p style={{fontSize:12, color:'var(--text-muted)', marginBottom:14, lineHeight:1.45}}>
              Use Spinner for discrete actions — saving, syncing, requesting. Always pair with a label.
            </p>
            <div style={{display:'flex', flexDirection:'column', gap:16}}>
              <div style={{display:'flex', gap:20, alignItems:'center'}}>
                <Spinner size="sm" color="forest" />
                <Spinner size="md" color="forest" />
                <Spinner size="lg" color="forest" />
              </div>
              <div style={{display:'flex', gap:16, alignItems:'center'}}>
                <Spinner size="md" color="forest" label="Syncing…" />
                <Spinner size="md" color="amber" label="Requesting…" />
              </div>
              <div style={{display:'flex', gap:12}}>
                <Button variant="primary" size="md" disabled>
                  <Spinner size="sm" color="white" /> Saving…
                </Button>
                <Button variant="amber" size="md" disabled>
                  <Spinner size="sm" color="white" /> Requesting…
                </Button>
              </div>
              <p className="hint">→ Replace button label with Spinner during submission</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
