<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../_ds_bundle.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F7F9F8; padding: 20px; font-family: var(--font-body); }
    h3 { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--text-primary); margin: 0 0 6px; }
    .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.45; }
    .label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 6px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { ErrorBanner, Input } = window.GoVehloDesignSystem_c5fd4e || {};

    function App() {
      return (
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:24}}>
          {/* Left: Banner variants */}
          <div>
            <h3>ErrorBanner</h3>
            <p className="sub">Persistent — stays until the condition resolves. Say what happened and what the user can do.</p>
            <div style={{display:'flex', flexDirection:'column', gap:10}}>
              <ErrorBanner message="Connection lost. Your changes are saved locally." variant="offline" onRetry={() => {}} />
              <ErrorBanner message="Couldn't load trips. Check your connection." variant="error" onRetry={() => {}} onDismiss={() => {}} />
              <ErrorBanner message="Sara's odometer overlaps with your last trip. Please check the end reading." variant="warning" />
            </div>
          </div>

          {/* Right: Form validation + guidance */}
          <div>
            <h3>Input validation</h3>
            <p className="sub">Use the Input error prop for field-level validation. ErrorBanner for form-level summaries.</p>
            <div style={{display:'flex', flexDirection:'column', gap:10}}>
              <Input label="End odometer" type="number" value="45200" error="Must be higher than start (45 318 km)." suffix="km" onChange={() => {}} />
              <Input label="Amount paid" type="number" value="" error="Required — enter the fuel receipt total." suffix="kr" onChange={() => {}} />
              <Input label="Liters" type="number" value="95" error="Seems too high — your tank is 55 L." suffix="L" onChange={() => {}} />
            </div>
            <div className="label">Voice rule</div>
            <p style={{fontSize:12, color:'var(--text-secondary)', lineHeight:1.5}}>
              Explain the problem and guide the fix.<br/>
              ✓ "Must be higher than start (45 318 km)."<br/>
              ✗ "Invalid value."
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
