<!-- @dsCard group="Colors" viewport="700x136" name="Amber Accent" subtitle="Money only — costs owed, payment requests, fuel totals" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); display: flex; height: 136px; }
    .swatch { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 14px; }
    .name { font-size: 12px; font-weight: 600; line-height: 1.3; }
    .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.72; margin-top: 2px; }
    .use  { font-size: 10px; opacity: 0.6; margin-top: 1px; }
    .rule { background: #FDE8D8; flex: 2; display: flex; align-items: center; padding: 0 20px; gap: 12px; }
    .rule-text { font-size: 13px; color: #A0522D; line-height: 1.5; }
    .rule-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: #F4A261; text-transform: uppercase; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="swatch" style="background:#F4A261; color:#1A2E1F;">
    <span class="name">Amber</span>
    <span class="hex">#F4A261</span>
    <span class="use">Money accent</span>
  </div>
  <div class="swatch" style="background:#FDE8D8; color:#1A2E1F;">
    <span class="name">Amber Light</span>
    <span class="hex">#FDE8D8</span>
    <span class="use">Amber tint surface</span>
  </div>
  <div class="rule">
    <div>
      <div class="rule-label">Rule</div>
      <div class="rule-text">Amber is reserved <em>exclusively</em> for monetary values — amounts owed, payment requests, and fuel totals. Never use it for navigation, decoration, or neutral UI states.</div>
    </div>
  </div>
</body>
</html>
