<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px base grid — --space-1 through --space-16" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F7F9F8; padding: 16px 24px; font-family: var(--font-body); }
    .grid { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .bar { background: var(--color-forest); border-radius: 3px; width: 28px; }
    .label { font-size: 10px; color: #6B8F7A; text-align: center; line-height: 1.3; }
    .value { font-family: var(--font-mono); font-size: 9px; color: #1A2E1F; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="bar" style="height:4px;"></div><span class="value">4px</span><span class="label">--space-1</span></div>
    <div class="item"><div class="bar" style="height:8px;"></div><span class="value">8px</span><span class="label">--space-2</span></div>
    <div class="item"><div class="bar" style="height:12px;"></div><span class="value">12px</span><span class="label">--space-3</span></div>
    <div class="item"><div class="bar" style="height:16px;"></div><span class="value">16px</span><span class="label">--space-4</span></div>
    <div class="item"><div class="bar" style="height:20px;"></div><span class="value">20px</span><span class="label">--space-5</span></div>
    <div class="item"><div class="bar" style="height:24px;"></div><span class="value">24px</span><span class="label">--space-6</span></div>
    <div class="item"><div class="bar" style="height:32px;"></div><span class="value">32px</span><span class="label">--space-8</span></div>
    <div class="item"><div class="bar" style="height:40px;"></div><span class="value">40px</span><span class="label">--space-10</span></div>
    <div class="item"><div class="bar" style="height:48px; background: var(--color-leaf);"></div><span class="value">48px</span><span class="label">--space-12</span></div>
    <div class="item"><div class="bar" style="height:64px; background: var(--color-amber);"></div><span class="value">64px</span><span class="label">--space-16</span></div>
  </div>
</body>
</html>
