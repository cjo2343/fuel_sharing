<!-- @dsCard group="Patterns" viewport="780x420" name="Workspace Switcher" subtitle="Car-sharing group selector for admin sidebar — default, hover, and open states" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 28px; background: #F7F9F8; display: flex; gap: 24px; font-family: 'Inter', sans-serif; align-items: flex-start; }
  .state-label { font-size: 10px; font-weight: 600; color: #6B8F7A; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; font-family: 'Inter', sans-serif; }
  .sidebar-ctx { width: 216px; background: #1A2E1F; border-radius: 12px; padding: 10px; }
  .ws-trigger { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
  .ws-avatar { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: 'Nunito', sans-serif; flex-shrink: 0; }
  .ws-name { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ws-sub { font-size: 10px; color: rgba(255,255,255,0.45); margin-top: 1px; }
  .ws-dropdown { margin-top: 6px; background: #243A2A; border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; padding: 6px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
  .ws-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; }
  .ws-item-avatar { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; font-family: 'Nunito', sans-serif; flex-shrink: 0; }
  .ws-item-name { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ws-item-sub { font-size: 10px; color: rgba(255,255,255,0.35); }
</style>
</head>
<body>

<!-- DEFAULT -->
<div>
  <div class="state-label">Default</div>
  <div class="sidebar-ctx">
    <div class="ws-trigger" style="background: rgba(255,255,255,0.06);">
      <div class="ws-avatar" style="background: #2D6A4F; color: #D8F3DC;">FJ</div>
      <div style="flex: 1; min-width: 0;">
        <div class="ws-name">Familien Jørgensen</div>
        <div class="ws-sub">5 members</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink: 0; color: rgba(255,255,255,0.4);"><path d="M3.5 5.25L7 8.75L10.5 5.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
  </div>
</div>

<!-- HOVER -->
<div>
  <div class="state-label">Hover</div>
  <div class="sidebar-ctx">
    <div class="ws-trigger" style="background: rgba(255,255,255,0.10);">
      <div class="ws-avatar" style="background: #2D6A4F; color: #D8F3DC;">FJ</div>
      <div style="flex: 1; min-width: 0;">
        <div class="ws-name">Familien Jørgensen</div>
        <div class="ws-sub">5 members</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink: 0; color: rgba(255,255,255,0.5);"><path d="M3.5 5.25L7 8.75L10.5 5.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
  </div>
</div>

<!-- OPEN -->
<div>
  <div class="state-label">Open</div>
  <div class="sidebar-ctx">
    <div class="ws-trigger" style="background: rgba(255,255,255,0.12);">
      <div class="ws-avatar" style="background: #2D6A4F; color: #D8F3DC;">FJ</div>
      <div style="flex: 1; min-width: 0;">
        <div class="ws-name">Familien Jørgensen</div>
        <div class="ws-sub">5 members</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink: 0; color: rgba(255,255,255,0.6); transform: rotate(180deg);"><path d="M3.5 5.25L7 8.75L10.5 5.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>

    <div class="ws-dropdown">
      <!-- Active -->
      <div class="ws-item" style="background: rgba(255,255,255,0.08);">
        <div class="ws-item-avatar" style="background: #2D6A4F; color: #D8F3DC;">FJ</div>
        <div style="flex: 1; min-width: 0;">
          <div class="ws-item-name" style="font-weight: 600; color: #fff;">Familien Jørgensen</div>
          <div class="ws-item-sub" style="color: rgba(255,255,255,0.45);">5 members · Owner</div>
        </div>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink: 0; color: #52B788;"><path d="M3 7L6 10L11 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <!-- Other 1 -->
      <div class="ws-item" style="margin-top: 2px;">
        <div class="ws-item-avatar" style="background: #52B788; color: #fff;">KB</div>
        <div style="flex: 1; min-width: 0;">
          <div class="ws-item-name">Kontor Bilpool</div>
          <div class="ws-item-sub">8 members · Admin</div>
        </div>
      </div>
      <!-- Other 2 -->
      <div class="ws-item" style="margin-top: 2px;">
        <div class="ws-item-avatar" style="background: #F4A261; color: #1A2E1F;">ND</div>
        <div style="flex: 1; min-width: 0;">
          <div class="ws-item-name">Nabo-deling</div>
          <div class="ws-item-sub">3 members · Member</div>
        </div>
      </div>
      <!-- Divider -->
      <div style="height: 1px; background: rgba(255,255,255,0.08); margin: 6px 4px;"></div>
      <!-- Create -->
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink: 0; color: rgba(255,255,255,0.4);"><path d="M8 3.5V12.5M3.5 8H12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
        <span style="font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.5);">Create new group</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
