<!-- @dsCard group="Colors" viewport="700x136" name="Surfaces & Text" subtitle="Warm White · surfaces · borders · text hierarchy" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); display: flex; height: 136px; background: #E8EDE9; }
    .swatch { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 14px; }
    .name { font-size: 12px; font-weight: 600; line-height: 1.3; }
    .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.65; margin-top: 2px; }
    .use  { font-size: 10px; opacity: 0.55; margin-top: 1px; }
    .divider { width: 1px; background: #D0D8D2; margin: 12px 0; }
    .text-col { flex: 1.5; display: flex; flex-direction: column; justify-content: center; padding: 0 20px; gap: 8px; }
    .text-row { display: flex; align-items: center; gap: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .text-label { font-size: 12px; font-weight: 500; }
    .text-val { font-family: var(--font-mono); font-size: 10px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="swatch" style="background:#F7F9F8; color:#1A2E1F; border: 1px solid #D0D8D2;">
    <span class="name">Warm White</span>
    <span class="hex">#F7F9F8</span>
    <span class="use">App background</span>
  </div>
  <div class="swatch" style="background:#FFFFFF; color:#1A2E1F; border: 1px solid #D0D8D2;">
    <span class="name">Surface</span>
    <span class="hex">#FFFFFF</span>
    <span class="use">Card surfaces</span>
  </div>
  <div class="swatch" style="background:#E2EDE8; color:#1A2E1F;">
    <span class="name">Border</span>
    <span class="hex">#E2EDE8</span>
    <span class="use">Dividers, input borders</span>
  </div>
  <div class="divider"></div>
  <div class="text-col">
    <div class="text-row">
      <div class="dot" style="background:#1A2E1F;"></div>
      <span class="text-label" style="color:#1A2E1F;">Primary text</span>
      <span class="text-val">#1A2E1F</span>
    </div>
    <div class="text-row">
      <div class="dot" style="background:#3D5C48;"></div>
      <span class="text-label" style="color:#3D5C48;">Secondary text</span>
      <span class="text-val">#3D5C48</span>
    </div>
    <div class="text-row">
      <div class="dot" style="background:#6B8F7A;"></div>
      <span class="text-label" style="color:#6B8F7A;">Muted text</span>
      <span class="text-val">#6B8F7A</span>
    </div>
  </div>
</body>
</html>
