<!-- @dsCard group="Components" viewport="700x520" name="Core" subtitle="Button · Badge · Avatar · Tag · Card · Odometer · StatusChip" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--color-warm-white); padding: 16px 20px; font-family: var(--font-body); }
    .sec { margin-bottom: 14px; }
    .lbl { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 7px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const NS = window.GoVehloDesignSystem_c5fd4e || {};
    const { Button, Badge, Avatar, Tag, Card, Odometer, StatusChip } = NS;

    function App() {
      return (
        <div>
          <div className="sec">
            <div className="lbl">Button — variants</div>
            <div className="row">
              <Button variant="primary"   size="md">Book car</Button>
              <Button variant="secondary" size="md">View trips</Button>
              <Button variant="ghost"     size="md">Cancel</Button>
              <Button variant="outline"   size="md">Export</Button>
              <Button variant="amber"     size="md">Request 52 kr</Button>
              <Button variant="danger"    size="md">Delete trip</Button>
            </div>
          </div>

          <div className="sec">
            <div className="lbl">Button — sizes &amp; states</div>
            <div className="row">
              <Button variant="primary" size="sm">Small</Button>
              <Button variant="primary" size="md">Medium</Button>
              <Button variant="primary" size="lg">Large</Button>
              <Button variant="primary" size="md" disabled>Disabled</Button>
              <Button variant="amber"   size="sm">+52 kr</Button>
            </div>
          </div>

          <div className="sec">
            <div className="lbl">Badge</div>
            <div className="row">
              <Badge variant="default">Shared car</Badge>
              <Badge variant="success" dot>Paid</Badge>
              <Badge variant="money"   dot>52 kr owed</Badge>
              <Badge variant="pending" dot>Pending</Badge>
              <Badge variant="error">Overdue</Badge>
              <Badge variant="forest">Active</Badge>
              <Badge variant="neutral">3 members</Badge>
            </div>
          </div>

          <div className="sec">
            <div className="lbl">StatusChip — settlement payment states</div>
            <div className="row">
              <StatusChip status="open" />
              <StatusChip status="requested" />
              <StatusChip status="paid" />
              <StatusChip status="pending" />
            </div>
          </div>

          <div className="sec">
            <div className="lbl">Odometer — km counter display</div>
            <div className="row">
              <Odometer value={1679}   unit="km" />
              <Odometer value={45318}  unit="km" />
              <Odometer value={0}      unit="km" />
            </div>
          </div>

          <div className="sec">
            <div className="lbl">Avatar &amp; Tag</div>
            <div className="row">
              <Avatar name="Christian Berg" size="xl" />
              <Avatar name="Lars Nielsen"   size="lg" online={true} />
              <Avatar name="Sara Thomsen"   size="md" online={false} />
              <Avatar name="Mikkel Bro"     size="sm" />
              <Avatar name="Pernille K"     size="xs" />
              <div style={{width:1, height:40, background:'var(--border-color)', margin:'0 4px'}}></div>
              <Tag label="Fuel"    color="amber" />
              <Tag label="Settled" color="leaf" />
              <Tag label="June"    color="default" />
              <Tag label="Lars"    color="neutral" onRemove={() => {}} />
            </div>
          </div>

          <div className="sec">
            <div className="lbl">Card</div>
            <div className="row" style={{alignItems:'stretch'}}>
              <Card padding="md" style={{width:160}}>
                <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:13,color:'var(--text-primary)'}}>Default card</div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>16px radius, subtle shadow</div>
              </Card>
              <Card padding="md" tinted style={{width:160}}>
                <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:13,color:'var(--text-primary)'}}>Tinted card</div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>Mist-green fill</div>
              </Card>
              <Card padding="md" elevated style={{width:160}}>
                <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:13,color:'var(--text-primary)'}}>Elevated card</div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>Modals, bottom sheets</div>
              </Card>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
