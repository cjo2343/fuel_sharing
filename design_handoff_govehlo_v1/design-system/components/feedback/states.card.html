<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--color-warm-white); padding: 16px 20px; font-family: var(--font-body); }
    .section-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Skeleton, Spinner, EmptyState, ErrorBanner } = window.GoVehloDesignSystem_c5fd4e || {};

    function App() {
      return (
        <div style={{display:'flex', flexDirection:'column', gap:18}}>
          {/* Skeleton */}
          <div>
            <div className="section-label">Skeleton</div>
            <div style={{display:'flex', gap:16}}>
              <div style={{flex:1, background:'#fff', borderRadius:16, padding:14, boxShadow:'0 1px 3px rgba(26,46,31,.07)'}}>
                <div style={{display:'flex', gap:10, alignItems:'center', marginBottom:10}}>
                  <Skeleton variant="circle" width={32} height={32} />
                  <div style={{flex:1}}>
                    <Skeleton variant="title" width="50%" />
                  </div>
                  <Skeleton variant="button" width={60} height={20} radius={10} />
                </div>
                <Skeleton variant="line" count={2} gap={6} />
              </div>
              <div style={{flex:1, background:'#fff', borderRadius:16, padding:14, boxShadow:'0 1px 3px rgba(26,46,31,.07)'}}>
                <div style={{display:'flex', gap:10, alignItems:'center', marginBottom:10}}>
                  <Skeleton variant="circle" width={32} height={32} />
                  <div style={{flex:1}}>
                    <Skeleton variant="title" width="40%" />
                  </div>
                  <Skeleton variant="button" width={60} height={20} radius={10} />
                </div>
                <Skeleton variant="line" count={2} gap={6} />
              </div>
            </div>
          </div>

          {/* Spinner */}
          <div>
            <div className="section-label">Spinner</div>
            <div style={{display:'flex', gap:24, alignItems:'center'}}>
              <Spinner size="sm" color="forest" />
              <Spinner size="md" color="forest" label="Syncing…" />
              <Spinner size="lg" color="amber" label="Requesting payment…" />
              <div style={{background:'var(--color-forest)', borderRadius:12, padding:'10px 18px', display:'inline-flex'}}>
                <Spinner size="sm" color="white" label="Saving…" style={{color:'#fff'}} />
              </div>
            </div>
          </div>

          {/* EmptyState */}
          <div>
            <div className="section-label">EmptyState</div>
            <div style={{display:'flex', gap:12}}>
              <div style={{flex:1, background:'#fff', borderRadius:16, boxShadow:'0 1px 3px rgba(26,46,31,.07)'}}>
                <EmptyState icon="📍" title="No trips yet" description="Log your first trip to start tracking." compact />
              </div>
              <div style={{flex:1, background:'#fff', borderRadius:16, boxShadow:'0 1px 3px rgba(26,46,31,.07)'}}>
                <EmptyState icon="✓" title="All settled" description="No outstanding balances." compact />
              </div>
            </div>
          </div>

          {/* ErrorBanner */}
          <div>
            <div className="section-label">ErrorBanner</div>
            <div style={{display:'flex', flexDirection:'column', gap:8}}>
              <ErrorBanner message="Connection lost. Your changes are saved locally." variant="offline" onRetry={() => {}} />
              <ErrorBanner message="Couldn't load trips. Check your connection." variant="error" onRetry={() => {}} onDismiss={() => {}} />
              <ErrorBanner message="Sara's odometer overlaps with your last trip." variant="warning" />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</html>
