<!-- @dsCard group="Type" viewport="700x240" name="Display & Heading" subtitle="Nunito — display, title, heading weights for GoVehlo UI" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-display); background: #F7F9F8; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; align-items: baseline; gap: 16px; }
    .spec { font-family: var(--font-body); font-size: 10px; color: #6B8F7A; white-space: nowrap; min-width: 120px; }
  </style>
</head>
<body>
  <div class="row">
    <span class="spec">32px · 900 · Display</span>
    <span style="font:900 32px/1.2 var(--font-display); color:#1A2E1F; letter-spacing:-0.01em;">Fill up. Drive fair.</span>
  </div>
  <div class="row">
    <span class="spec">22px · 800 · Title</span>
    <span style="font:800 22px/1.25 var(--font-display); color:#1A2E1F; letter-spacing:-0.005em;">Your balance this month</span>
  </div>
  <div class="row">
    <span class="spec">17px · 700 · Heading</span>
    <span style="font:700 17px/1.35 var(--font-display); color:#1A2E1F;">Recent trips</span>
  </div>
  <div style="height: 1px; background: #E2EDE8; margin: 4px 0;"></div>
  <div class="row">
    <span class="spec">wordmark · 900</span>
    <span style="font-family:var(--font-display); font-weight:900; font-size:28px; line-height:1; letter-spacing:-0.01em;">
      <span style="color:#2D6A4F;">Go</span><span style="color:#1A2E1F;">Vehlo</span>
    </span>
  </div>
</body>
</html>
