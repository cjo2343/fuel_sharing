<!-- @dsCard group="Foundations" viewport="700x200" name="Shadows" subtitle="Green-tinted shadow system — card · hover · elevated · button" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #EBF2ED; padding: 24px; font-family: var(--font-body); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .box  { width: 100px; height: 80px; background: #fff; border-radius: 12px; }
    .name { font-family: var(--font-mono); font-size: 10px; color: #2D6A4F; }
    .desc { font-size: 10px; color: #6B8F7A; text-align: center; line-height: 1.3; }
  </style>
</head>
<body>
  <div class="item">
    <div class="box" style="box-shadow: 0 1px 3px rgba(26,46,31,.07), 0 2px 8px rgba(26,46,31,.04);"></div>
    <span class="name">--shadow-card</span>
    <span class="desc">Default card<br>resting state</span>
  </div>
  <div class="item">
    <div class="box" style="box-shadow: 0 4px 16px rgba(26,46,31,.12), 0 2px 6px rgba(26,46,31,.06);"></div>
    <span class="name">--shadow-card-hover</span>
    <span class="desc">Card on hover<br>+lift 1px</span>
  </div>
  <div class="item">
    <div class="box" style="box-shadow: 0 8px 32px rgba(26,46,31,.16), 0 2px 8px rgba(26,46,31,.08);"></div>
    <span class="name">--shadow-elevated</span>
    <span class="desc">Modals, toasts<br>bottom sheets</span>
  </div>
  <div class="item">
    <div class="box" style="background:#2D6A4F; box-shadow: 0 2px 8px rgba(45,106,79,.30);"></div>
    <span class="name">--shadow-btn</span>
    <span class="desc">Primary button<br>green glow</span>
  </div>
  <div class="item">
    <div class="box" style="background:#F4A261; box-shadow: 0 2px 8px rgba(244,162,97,.35);"></div>
    <span class="name">--shadow-btn-amber</span>
    <span class="desc">Amber/money<br>button glow</span>
  </div>
</body>
</html>
