<!-- @dsCard group="Colors" viewport="700x136" name="Brand Greens" subtitle="Deep Forest · Forest · Leaf · Mist — the primary green palette" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); display: flex; height: 136px; }
    .swatch { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 14px; }
    .name { font-size: 12px; font-weight: 600; line-height: 1.3; }
    .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.72; margin-top: 2px; }
    .use  { font-size: 10px; opacity: 0.6; margin-top: 1px; }
  </style>
</head>
<body>
  <div class="swatch" style="background:#1A2E1F; color:#fff;">
    <span class="name">Deep Forest</span>
    <span class="hex">#1A2E1F</span>
    <span class="use">Headings, heavy text</span>
  </div>
  <div class="swatch" style="background:#2D6A4F; color:#fff;">
    <span class="name">Forest</span>
    <span class="hex">#2D6A4F</span>
    <span class="use">Primary — CTAs, logo</span>
  </div>
  <div class="swatch" style="background:#52B788; color:#fff;">
    <span class="name">Leaf</span>
    <span class="hex">#52B788</span>
    <span class="use">Positive, settled, paid</span>
  </div>
  <div class="swatch" style="background:#D8F3DC; color:#1A2E1F;">
    <span class="name">Mist</span>
    <span class="hex">#D8F3DC</span>
    <span class="use">Card fills, backgrounds</span>
  </div>
</body>
</html>
