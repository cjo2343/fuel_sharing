<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark" subtitle="GoVehlo — Nunito 900, two-tone: Forest Go + Deep Forest Vehlo" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F7F9F8; padding: 24px; font-family: var(--font-body); display: flex; flex-direction: column; gap: 16px; justify-content: center; height: 180px; }
    .wordmark-row { display: flex; align-items: center; gap: 20px; }
    .wm { font-family: var(--font-display); font-weight: 900; letter-spacing: -0.01em; line-height: 1; }
    .label { font-size: 10px; color: #6B8F7A; min-width: 80px; }
    .rule  { font-size: 11px; color: #6B8F7A; line-height: 1.5; border-top: 1px solid #E2EDE8; padding-top: 10px; }
    .rule strong { color: #D95050; }
  </style>
</head>
<body>
  <div class="wordmark-row">
    <span class="label">Primary · light bg</span>
    <span class="wm" style="font-size:32px;">
      <span style="color:#2D6A4F;">Go</span><span style="color: rgb(82, 183, 136)">Vehlo</span>
    </span>
  </div>
  <div class="wordmark-row">
    <span class="label">Reversed · dark bg</span>
    <span class="wm" style="font-size:32px; background:#1A2E1F; padding: 4px 12px; border-radius:8px; color:#fff;">
      GoVehlo
    </span>
  </div>
  <div class="rule">
    <strong>Never:</strong> Go Vehlo · go-vehlo · GOVEHLO · Govehlo · GoVehlo App
    &nbsp;·&nbsp; Minimum width: 80px full lockup, 24px icon alone.
  </div>
</body>
</html>
