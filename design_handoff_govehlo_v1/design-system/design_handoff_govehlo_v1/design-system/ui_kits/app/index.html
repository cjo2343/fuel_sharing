<!-- @dsCard group="GoVehlo App" viewport="390x760" name="App Prototype" subtitle="Interactive PWA — Home · Trips · Fuel · Settlement · History" -->
<!-- @startingPoint section="GoVehlo App" subtitle="Full interactive GoVehlo PWA prototype — all 5 screens" viewport="390x844" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoVehlo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600&display=swap">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1A2E1F; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px; font-family: 'Inter', system-ui, sans-serif; }
    .app { width: 390px; min-height: 100vh; background: #F7F9F8; display: flex; flex-direction: column; position: relative; }
    @media (min-width: 500px) {
      .app { height: 760px; min-height: unset; border-radius: 36px; overflow: hidden; box-shadow: 0 48px 96px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); }
    }
    .screen { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: #F7F9F8; }
    .slbl { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; color: #6B8F7A; text-transform: uppercase; letter-spacing: .07em; padding: 14px 16px 6px; }
    @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

    /* ═══════════════════════════════════════════
       INLINE COMPONENTS (self-contained)
    ═══════════════════════════════════════════ */

    function GVHeader({ greeting, subtitle, compact = false }) {
      return (
        <div style={{ background: '#2D6A4F', padding: compact ? '12px 16px' : '20px 16px 24px', paddingTop: compact ? '12px' : '44px', display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', minHeight: compact ? '52px' : '88px' }}>
          <div>
            {greeting && <h1 style={{ fontFamily: "'Nunito', sans-serif", fontWeight: compact ? 700 : 800, fontSize: compact ? '17px' : '22px', color: '#fff', margin: 0, lineHeight: 1.2 }}>{greeting}</h1>}
            {subtitle && <p style={{ fontFamily: "'Inter', sans-serif", fontSize: '11px', color: 'rgba(255,255,255,.7)', margin: '3px 0 0', lineHeight: 1.3 }}>{subtitle}</p>}
          </div>
        </div>
      );
    }

    function GVNav({ items, active, onSelect }) {
      return (
        <nav style={{ display: 'flex', height: '64px', background: '#fff', borderTop: '1px solid #E2EDE8', boxShadow: '0 -2px 12px rgba(26,46,31,.08)', flexShrink: 0 }}>
          {items.map(item => {
            const isActive = active === item.id;
            return (
              <button key={item.id} onClick={() => onSelect(item.id)} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '3px', background: 'none', border: 'none', cursor: 'pointer', color: isActive ? '#2D6A4F' : '#6B8F7A', transition: 'color 140ms ease', WebkitTapHighlightColor: 'transparent' }}>
                {item.icon}
                <span style={{ fontFamily: "'Inter', sans-serif", fontWeight: isActive ? 600 : 400, fontSize: '10px', lineHeight: 1 }}>{item.label}</span>
              </button>
            );
          })}
        </nav>
      );
    }

    const AV_COLORS = [{ bg:'#2D6A4F',fg:'#fff'},{bg:'#52B788',fg:'#fff'},{bg:'#F4A261',fg:'#1A2E1F'},{bg:'#A8D5BA',fg:'#1A2E1F'},{bg:'#1A2E1F',fg:'#fff'},{bg:'#7EC8A4',fg:'#fff'}];
    function GVAvatar({ name = '?', size = 'md', online }) {
      const px = { xs:24, sm:32, md:40, lg:52, xl:64 }[size] || 40;
      let h = 0; for (let i=0;i<name.length;i++) h = name.charCodeAt(i)+((h<<5)-h);
      const c = AV_COLORS[Math.abs(h) % AV_COLORS.length];
      const parts = name.trim().split(/\s+/);
      const ini = parts.length >= 2 ? (parts[0][0]+parts[parts.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
      const dSz = Math.max(8, Math.round(px*.22));
      return (
        <div style={{ position:'relative', display:'inline-flex', flexShrink:0 }}>
          <div style={{ width:px, height:px, borderRadius:'50%', background:c.bg, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:Math.round(px*.38), color:c.fg, userSelect:'none', flexShrink:0 }}>{ini}</div>
          {online !== undefined && <span style={{ position:'absolute', bottom:0, right:0, width:dSz, height:dSz, borderRadius:'50%', background: online ? '#52B788':'#C0CCC5', border:'2px solid #F7F9F8' }} />}
        </div>
      );
    }

    const BADGE_V = { default:{bg:'#D8F3DC',color:'#2D6A4F'}, success:{bg:'#D1F5E3',color:'#1A7A47'}, money:{bg:'#FDE8D8',color:'#A0522D'}, pending:{bg:'#FEF3E0',color:'#B07A2A'}, neutral:{bg:'#EAEFEC',color:'#6B8F7A'} };
    function GVBadge({ variant='default', dot, children }) {
      const v = BADGE_V[variant] || BADGE_V.default;
      return <span style={{ display:'inline-flex', alignItems:'center', gap:'4px', fontFamily:"'Inter',sans-serif", fontWeight:500, fontSize:'11px', height:'20px', padding:'0 8px', borderRadius:'9999px', whiteSpace:'nowrap', background:v.bg, color:v.color }}>{dot && <span style={{ width:5,height:5,borderRadius:'50%',background:v.color,flexShrink:0 }} />}{children}</span>;
    }

    function GVButton({ variant='primary', size='md', fullWidth, children, onClick }) {
      const [hov, setHov] = React.useState(false);
      const V = { primary:{bg:'#2D6A4F',hov:'#245940',color:'#fff'}, secondary:{bg:'#D8F3DC',hov:'#C5E5CE',color:'#2D6A4F'}, amber:{bg:'#F4A261',hov:'#E8905C',color:'#1A2E1F'}, ghost:{bg:'transparent',hov:'#D8F3DC',color:'#2D6A4F'} };
      const v = V[variant] || V.primary;
      const sz = size==='sm' ? {p:'7px 14px',fs:'13px'} : size==='lg' ? {p:'15px 28px',fs:'17px'} : {p:'11px 20px',fs:'15px'};
      return <button onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{ display:'inline-flex', alignItems:'center', justifyContent:'center', fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:sz.fs, padding:sz.p, borderRadius:'12px', border:'none', cursor:'pointer', width:fullWidth?'100%':'auto', background:hov?v.hov:v.bg, color:v.color, transition:'background 140ms ease', minHeight:'44px', boxShadow: variant==='primary'?'0 2px 8px rgba(45,106,79,.3)': variant==='amber'?'0 2px 8px rgba(244,162,97,.35)':'none' }}>{children}</button>;
    }

    const DIR_C = { owe:'#F4A261', receive:'#52B788', settled:'#6B8F7A' };
    function GVAmount({ amount, currency='kr', direction='owe', label, size='lg' }) {
      const fs = { sm:'20px', md:'28px', lg:'40px', xl:'52px' }[size]||'40px';
      const cfs = { sm:'13px', md:'16px', lg:'20px', xl:'24px' }[size]||'20px';
      const color = DIR_C[direction] || DIR_C.owe;
      const fmt = typeof amount==='number' ? amount.toFixed(2).replace('.',',') : String(amount);
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
          {label && <span style={{ fontFamily:"'Inter',sans-serif", fontWeight:500, fontSize:'11px', color:'#6B8F7A', lineHeight:1.3 }}>{label}</span>}
          <div style={{ display:'flex', alignItems:'baseline', gap:'4px' }}>
            <span style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:fs, color, lineHeight:1, letterSpacing:'-0.02em' }}>{fmt}</span>
            <span style={{ fontFamily:"'Inter',sans-serif", fontWeight:600, fontSize:cfs, color, opacity:.8 }}>{currency}</span>
          </div>
        </div>
      );
    }

    function GVTripCard({ date, startOdo, endOdo, driver, cost, onClick }) {
      const [hov, setHov] = React.useState(false);
      const km = endOdo!=null && startOdo!=null ? endOdo-startOdo : null;
      let h=0; for(let i=0;i<(driver||'').length;i++) h=driver.charCodeAt(i)+((h<<5)-h);
      const initBg = AV_COLORS[Math.abs(h)%AV_COLORS.length];
      return (
        <div onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{ display:'flex', alignItems:'center', gap:'12px', padding:'12px', background:'#fff', borderRadius:'16px', boxShadow: hov?'0 4px 16px rgba(26,46,31,.12)':'0 1px 3px rgba(26,46,31,.07),0 2px 8px rgba(26,46,31,.04)', cursor:onClick?'pointer':'default', transition:'box-shadow 180ms ease, transform 120ms ease', transform: hov&&onClick?'translateY(-1px)':'none' }}>
          <div style={{ width:40, height:40, borderRadius:'8px', background:initBg.bg, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:'15px', color:initBg.fg, flexShrink:0, userSelect:'none' }}>{(driver||'T')[0]}</div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:'15px', color:'#1A2E1F', marginBottom:'2px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{driver||'Trip'}</div>
            <div style={{ fontFamily:"'Courier New',monospace", fontSize:'12px', color:'#6B8F7A', letterSpacing:'0.04em' }}>{startOdo!=null?startOdo.toLocaleString('da-DK'):'—'}{' → '}{endOdo!=null?endOdo.toLocaleString('da-DK'):'—'}{km!=null?` · ${km} km`:''}</div>
          </div>
          <div style={{ textAlign:'right', flexShrink:0 }}>
            <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:600, fontSize:'14px', color:cost!=null?'#F4A261':'#6B8F7A' }}>{cost!=null?`${cost.toFixed(2).replace('.',',')} kr`:'—'}</div>
            <div style={{ fontFamily:"'Inter',sans-serif", fontSize:'11px', color:'#6B8F7A', marginTop:'2px' }}>{date||''}</div>
          </div>
        </div>
      );
    }

    function GVSettlementCard({ personName, amount, currency='kr', direction='owe', onAction }) {
      const [hov, setHov] = React.useState(false);
      const settled = direction==='settled';
      const amtColor = settled?'#6B8F7A':direction==='owe'?'#F4A261':'#52B788';
      const lbl = settled?`Settled with ${personName}`:direction==='owe'?`You owe ${personName}`:`${personName} owes you`;
      const fmt = typeof amount==='number'?amount.toFixed(2).replace('.',','):String(amount);
      const btnBg = direction==='owe'?(hov?'#E8905C':'#F4A261'):(hov?'#3FA375':'#52B788');
      const iconBg = settled?'#EAEFEC':direction==='owe'?'#FDE8D8':'#D1F5E3';
      return (
        <div style={{ display:'flex', alignItems:'center', gap:'12px', padding:'14px', background:'#fff', borderRadius:'16px', boxShadow:'0 1px 3px rgba(26,46,31,.07),0 2px 8px rgba(26,46,31,.04)' }}>
          <div style={{ width:44, height:44, borderRadius:'50%', background:iconBg, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:'15px', color:amtColor, flexShrink:0, userSelect:'none' }}>{(personName||'?').slice(0,2).toUpperCase()}</div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:500, fontSize:'12px', color:'#6B8F7A', marginBottom:'2px' }}>{lbl}</div>
            <div style={{ display:'flex', alignItems:'baseline', gap:'3px' }}>
              <span style={{ fontFamily:"'Nunito',sans-serif", fontWeight:900, fontSize:'22px', color:amtColor, letterSpacing:'-0.02em', lineHeight:1 }}>{fmt}</span>
              <span style={{ fontFamily:"'Inter',sans-serif", fontWeight:600, fontSize:'14px', color:amtColor, opacity:.8 }}>{currency}</span>
            </div>
          </div>
          {!settled && <button onClick={onAction} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{ padding:'8px 14px', borderRadius:'12px', border:'none', background:btnBg, color:direction==='owe'?'#1A2E1F':'#fff', fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:'13px', cursor:'pointer', transition:'background 140ms ease', flexShrink:0, minHeight:'36px' }}>{direction==='owe'?'Request':'Mark paid'}</button>}
          {settled && <span style={{ fontFamily:"'Inter',sans-serif", fontSize:'11px', color:'#52B788', fontWeight:600, flexShrink:0 }}>✓ Settled</span>}
        </div>
      );
    }

    /* ═══════════════════════════════════════════
       NAV ICONS
    ═══════════════════════════════════════════ */
    const I = ({d,d2}) => <svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><path d={d}/>{d2&&<path d={d2}/>}</svg>;
    const tabs = [
      { id:'home',       label:'Home',       icon:<I d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" d2="M9 22V12h6v10"/> },
      { id:'trips',      label:'Trips',      icon:<svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> },
      { id:'fuel',       label:'Fuel',       icon:<I d="M3 22V9a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13" d2="M3 11h12"/> },
      { id:'settlement', label:'Settlement', icon:<svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="7" y2="7"/><polyline points="3 11 7 7 11 11"/><line x1="17" y1="7" x2="17" y2="17"/><polyline points="13 13 17 17 21 13"/></svg> },
      { id:'history',    label:'History',    icon:<svg width={22} height={22} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><polyline points="12 7 12 12 15 15"/></svg> },
    ];

    /* ═══════════════════════════════════════════
       FAKE DATA
    ═══════════════════════════════════════════ */
    const TRIPS = [
      { id:1, driver:'Christian', startOdo:45231, endOdo:45318, cost:22.50, date:'22 jun' },
      { id:2, driver:'Lars',      startOdo:45318, endOdo:45502, cost:47.00, date:'18 jun' },
      { id:3, driver:'Sara',      startOdo:45502, endOdo:45571, cost:17.60, date:'15 jun' },
      { id:4, driver:'Christian', startOdo:45571, endOdo:45660, cost:22.75, date:'12 jun' },
      { id:5, driver:'Mikkel',    startOdo:45660, endOdo:45748, cost:22.50, date:' 9 jun' },
    ];
    const FUEL = [
      { date:'22 jun', liters:34.2, rate:14.50, total:495.90 },
      { date:'15 jun', liters:28.5, rate:14.35, total:409.00 },
      { date:' 8 jun', liters:31.0, rate:14.60, total:452.60 },
    ];
    const GROUP = ['Christian','Lars','Sara','Mikkel'];

    /* ═══════════════════════════════════════════
       SCREENS
    ═══════════════════════════════════════════ */
    function HomeScreen({ onNavigate }) {
      return (
        <div className="screen">
          <GVHeader greeting="Good morning, Christian." subtitle="Saved · 14:05" />
          <div style={{ padding:16, display:'flex', flexDirection:'column', gap:16 }}>

            {/* Balance card */}
            <div style={{ background:'#fff', borderRadius:16, padding:16, boxShadow:'0 1px 3px rgba(26,46,31,.07),0 2px 8px rgba(26,46,31,.04)', display:'flex' }}>
              <div style={{ flex:1, borderRight:'1px solid #E2EDE8', paddingRight:16 }}>
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:11, fontWeight:500, color:'#6B8F7A', marginBottom:4 }}>You owe</div>
                <GVAmount amount={52.00} direction="owe" size="lg" />
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:12, color:'#3D5C48', marginTop:4 }}>to Lars</div>
              </div>
              <div style={{ flex:1, paddingLeft:16 }}>
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:11, fontWeight:500, color:'#6B8F7A', marginBottom:4 }}>Owed to you</div>
                <GVAmount amount={120.50} direction="receive" size="lg" />
                <div style={{ fontFamily:"'Inter',sans-serif", fontSize:12, color:'#3D5C48', marginTop:4 }}>from Sara</div>
              </div>
            </div>

            {/* Group */}
            <div>
              <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:15, color:'#1A2E1F', marginBottom:10 }}>Your group</div>
              <div style={{ display:'flex', gap:20, alignItems:'center' }}>
                {GROUP.map((name,i) => (
                  <div key={name} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:5 }}>
                    <GVAvatar name={name} size="md" online={i < 3} />
                    <span style={{ fontFamily:"'Inter',sans-serif", fontSize:11, color:'#3D5C48', fontWeight:500 }}>{name}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Recent trips */}
            <div>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
                <span style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:15, color:'#1A2E1F' }}>Recent trips</span>
                <button onClick={() => onNavigate('trips')} style={{ fontFamily:"'Inter',sans-serif", fontSize:12, color:'#2D6A4F', fontWeight:600, background:'none', border:'none', cursor:'pointer' }}>See all</button>
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {TRIPS.slice(0,3).map(t => <GVTripCard key={t.id} {...t} onClick={() => {}} />)}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TripsScreen() {
      const [filter, setFilter] = React.useState('all');
      const shown = filter==='mine' ? TRIPS.filter(t=>t.driver==='Christian') : filter==='theirs' ? TRIPS.filter(t=>t.driver!=='Christian') : TRIPS;
      return (
        <div className="screen">
          <GVHeader compact greeting="Trips" />
          <div style={{ display:'flex', gap:4, padding:'12px 16px 4px' }}>
            {['all','mine','theirs'].map(f => (
              <button key={f} onClick={() => setFilter(f)} style={{ padding:'6px 14px', borderRadius:'9999px', border:'none', cursor:'pointer', fontFamily:"'Inter',sans-serif", fontSize:12, fontWeight:600, background:filter===f?'#2D6A4F':'#D8F3DC', color:filter===f?'#fff':'#2D6A4F', transition:'background 140ms ease' }}>
                {f.charAt(0).toUpperCase()+f.slice(1)}
              </button>
            ))}
          </div>
          <div style={{ padding:16, display:'flex', flexDirection:'column', gap:8 }}>
            {shown.map(t => <GVTripCard key={t.id} {...t} onClick={() => {}} />)}
          </div>
        </div>
      );
    }

    function FuelScreen() {
      return (
        <div className="screen">
          <GVHeader compact greeting="Fuel Log" />
          <div style={{ padding:16, display:'flex', flexDirection:'column', gap:12 }}>
            <GVButton variant="primary" fullWidth>+ Add fuel entry</GVButton>
            {FUEL.map((f,i) => (
              <div key={i} style={{ background:'#fff', borderRadius:16, padding:14, boxShadow:'0 1px 3px rgba(26,46,31,.07),0 2px 8px rgba(26,46,31,.04)' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                  <div>
                    <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:15, color:'#1A2E1F' }}>{f.date}</div>
                    <div style={{ fontFamily:"'Courier New',monospace", fontSize:12, color:'#6B8F7A', marginTop:2, letterSpacing:'0.04em' }}>{f.liters.toFixed(1)} L @ {f.rate.toFixed(2).replace('.',',')} kr/L</div>
                  </div>
                  <div style={{ textAlign:'right' }}>
                    <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:800, fontSize:18, color:'#F4A261', letterSpacing:'-0.01em' }}>{f.total.toFixed(2).replace('.',',')} kr</div>
                    <div style={{ marginTop:4 }}><GVBadge variant="money">Fuel</GVBadge></div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function SettlementScreen({ onToast }) {
      return (
        <div className="screen">
          <GVHeader compact greeting="Settlement" />
          <div style={{ padding:'0 16px 16px' }}>
            <div className="slbl">You owe</div>
            <GVSettlementCard personName="Lars"   amount={52.00}  direction="owe"     onAction={() => onToast('Payment requested from Lars.')} />
            <div className="slbl" style={{ paddingTop:12 }}>Owed to you</div>
            <GVSettlementCard personName="Sara"   amount={120.50} direction="receive" onAction={() => onToast('Marked as paid by Sara.')} />
            <div className="slbl" style={{ paddingTop:12 }}>Settled</div>
            <GVSettlementCard personName="Mikkel" amount={34.00}  direction="settled" />
          </div>
        </div>
      );
    }

    function HistoryScreen() {
      const groups = [
        { month:'June 2026', items:[
          { desc:'Fuel split · 3 trips', amount:47.00, date:'22 jun', person:'Lars'   },
          { desc:'Sara → 69 km trip',    amount:17.60, date:'15 jun', person:'Sara'   },
          { desc:'Monthly settlement',   amount:52.00, date:'10 jun', person:'Lars'   },
        ]},
        { month:'May 2026', items:[
          { desc:'Full settlement',      amount:89.50, date:'31 maj', person:'Sara'   },
          { desc:'Mikkel fuel share',    amount:34.00, date:'28 maj', person:'Mikkel' },
        ]},
      ];
      return (
        <div className="screen">
          <GVHeader compact greeting="History" />
          <div style={{ padding:'0 16px 16px' }}>
            {groups.map(g => (
              <div key={g.month}>
                <div className="slbl">{g.month}</div>
                <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                  {g.items.map((item,i) => (
                    <div key={i} style={{ background:'#fff', borderRadius:16, padding:'12px 14px', boxShadow:'0 1px 3px rgba(26,46,31,.07)', display:'flex', alignItems:'center', gap:12 }}>
                      <GVAvatar name={item.person} size="sm" />
                      <div style={{ flex:1 }}>
                        <div style={{ fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:14, color:'#1A2E1F' }}>{item.desc}</div>
                        <div style={{ fontFamily:"'Inter',sans-serif", fontSize:11, color:'#6B8F7A', marginTop:1 }}>{item.date}</div>
                      </div>
                      <div style={{ textAlign:'right' }}>
                        <div style={{ fontFamily:"'Inter',sans-serif", fontWeight:600, fontSize:13, color:'#6B8F7A' }}>{item.amount.toFixed(2).replace('.',',')} kr</div>
                        <div style={{ fontFamily:"'Inter',sans-serif", fontSize:11, color:'#52B788', fontWeight:600, marginTop:1 }}>✓ Settled</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════
       APP SHELL
    ═══════════════════════════════════════════ */
    function App() {
      const [screen, setScreen] = React.useState('home');
      const [toast, setToast] = React.useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      return (
        <div className="app">
          {screen === 'home'       && <HomeScreen onNavigate={setScreen} />}
          {screen === 'trips'      && <TripsScreen />}
          {screen === 'fuel'       && <FuelScreen />}
          {screen === 'settlement' && <SettlementScreen onToast={showToast} />}
          {screen === 'history'    && <HistoryScreen />}

          {toast && (
            <div style={{ position:'absolute', bottom:74, left:12, right:12, zIndex:200, background:'#1A2E1F', color:'#fff', borderRadius:'12px', padding:'12px 16px', display:'flex', alignItems:'center', gap:10, boxShadow:'0 8px 32px rgba(26,46,31,.3)', fontFamily:"'Inter',sans-serif", fontSize:14, fontWeight:500, animation:'slideUp .22s ease' }}>
              <span style={{ width:20,height:20,borderRadius:'50%',background:'rgba(255,255,255,.18)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,flexShrink:0 }}>✓</span>
              <span style={{ flex:1 }}>{toast}</span>
              <button onClick={() => setToast(null)} style={{ background:'none',border:'none',color:'rgba(255,255,255,.6)',cursor:'pointer',fontSize:18,lineHeight:1 }}>×</button>
            </div>
          )}

          <GVNav items={tabs} active={screen} onSelect={setScreen} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
