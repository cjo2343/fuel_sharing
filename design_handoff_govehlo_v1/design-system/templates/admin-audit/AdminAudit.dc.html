<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Admin Audit Log" description="Filterable activity log with actor, action type, entity, timestamp, and severity" -->
<helmet>
  <script src="./ds-base.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="../admin-shared/AdminLayout.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F7F9F8; }
  </style>
</helmet>

<x-import
  component-from-global-scope="AdminAuditContent"
  from="./AdminAudit.jsx"
  hint-size="100%,100vh"
  style="display:block;width:100%;height:100vh;"
></x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Default&quot;,&quot;Compact&quot;,&quot;Dark&quot;],&quot;default&quot;:&quot;Default&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Comfortable&quot;,&quot;Dense&quot;],&quot;default&quot;:&quot;Dense&quot;}}">
class Component extends DCLogic {
  state = { layout: 'Default', density: 'Dense' };
  renderVals() {
    return {
      layout: this.props.layout ?? this.state.layout,
      density: this.props.density ?? this.state.density,
    };
  }
}
</script>
</body>
</html>
