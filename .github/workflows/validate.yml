name: Validate Fuel Ledger

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Fast validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run validation suite
        run: npm run validate

      - name: Run release readiness checks
        run: node tools/check-release-readiness.mjs

  playwright-smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e

  schema-equivalence:
    name: Migration/schema equivalence (GV-175)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Replays supabase/migrations/*.sql and supabase-schema.sql into two
      # disposable Postgres 15 databases and diffs the schema dumps — proves the
      # consolidated schema reproduces the migrations' end state (the grep-based
      # guard in test-migrations.mjs cannot see semantic drift).
      - name: Verify schema equivalence
        run: node tools/check-schema-equivalence.mjs

  functional-smoke:
    name: Delete-account/push functional smoke (GV-180)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Replays supabase-schema.sql into a disposable Postgres 15, seeds a
      # realistic two-ledger dataset, runs delete_my_account()/upsert_push_token()
      # as impersonated JWT users, and asserts every scrub, succession, snapshot
      # rewrite, sole-member cascade, and push-token purge (migrations 056/057).
      # Structural checks (schema-equivalence) can't see this behaviour.
      - name: Run functional smoke test
        run: bash tools/test-functional-smoke.sh
