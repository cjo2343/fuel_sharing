name: Validate Fuel Ledger

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check Python syntax
        run: python3 -m py_compile server.py

      - name: Check JSON
        run: python3 -m json.tool ledger-data.json > /dev/null

      - name: Check app references
        run: node tools/check-app-references.mjs
