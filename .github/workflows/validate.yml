name: Validate Fuel Ledger

# GV-399: no `push: branches: [main]` here, deliberately. A merge re-ran this whole
# suite against a commit the PR had already checked — 152 times in July 2026.
#
# umbrella.yml, next door, KEEPS its push trigger and that is not an oversight. It
# checks invariants that span all three repos, so it can go red for a reason no single
# PR could have shown: two PRs in different repos that conflict without touching a
# shared file. That is the one class the pre-merge check genuinely cannot cover, and
# it is exactly why the cheap post-merge run there is worth paying for and the
# expensive one here is not.
#
# The failure modes this repo has actually hit — a migration-number collision, an
# APP_VERSION/version.json lockstep collision — are same-file, same-line conflicts.
# Two PRs both adding migration 148 also both append to the `expected` array in
# tools/test-migrations.mjs and both append to the end of supabase-schema.sql, so git
# blocks the second merge before CI has anything to say.
on:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # CI-minutes diet (GV-283, tightened by GV-394)
  # ---------------------------------------------------------------------------
  # The five heavy jobs below (schema-equivalence, db-types, role-matrix,
  # functional-smoke, drill-smoke) each spin up a disposable Postgres and are the
  # dominant consumers of the account's Actions minutes — they ran on EVERY push
  # and PR, even for changes that cannot possibly affect the schema (design
  # tokens, docs, this workflow's siblings, etc.).
  #
  # GV-283 introduced a cheap `changes` gate job that computed the diff and
  # exposed a `run_heavy` output for the heavy jobs to gate on. GV-394 MERGED
  # that job into `validate` — the gate is now the first step here, and the
  # `run_heavy` output is published by this job instead.
  #
  # Why: GitHub bills per JOB, rounded UP to a whole minute. The gate did ~6
  # seconds of `git diff` and cost a full billed minute on every single run, and
  # it ran on 100% of them (326 runs in July 2026 = 326 minutes to decide
  # whether to run something). Folding it into a job that has to run anyway
  # makes it free: `validate` measured 10-14s and this adds ~6s, so the merged
  # job still finishes comfortably inside the same one billed minute.
  #
  # Wall-clock cost of the merge is ~7 seconds: the heavy jobs used to start
  # after the gate job (~8s) and now start after this whole job (~15-20s). The
  # heavy jobs themselves are unchanged and still run in parallel with each
  # other.
  #
  # The heavy jobs `needs: validate` and gate on the output below, so when
  # nothing schema-relevant changed they are SKIPPED (a neutral result — not a
  # failure — so branch protection / merges are never blocked, and a skipped job
  # still REPORTS, unlike a workflow filtered out by a top-level `paths:` — the
  # same distinction GV-391 relies on in umbrella.yml).
  #
  # NOTE ON INDEPENDENCE (this is load-bearing — do not "simplify" it):
  # `changes` used to run in PARALLEL with `validate`, so a failing `npm run
  # validate` never suppressed the heavy suites. That property is preserved
  # deliberately in two places:
  #   1. The gate step below runs FIRST, before npm ci — so `run_heavy` is
  #      published even when a later step in this job fails.
  #   2. The heavy jobs gate on `!cancelled() && ...` rather than the implicit
  #      `success()`, so they still run when this job goes red.
  # Drop either and a trivial token-drift failure would silently skip the schema
  # equivalence / RLS / smoke suites.
  validate:
    name: Fast validation (migrations, SQL ambiguity, token drift)
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.filter.outputs.run_heavy }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history so the diff base (PR base branch / push before-sha) is
          # reachable — a shallow clone would not contain it. The repo is ~38 MB
          # with ~1k commits, so the unshallow costs a couple of seconds.
          fetch-depth: 0

      # FIRST step on purpose — see "NOTE ON INDEPENDENCE" above.
      - name: Decide whether the Docker-backed jobs must run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Paths whose change requires the schema/type/tooling suites to run.
          # A change to THIS workflow file itself also arms them (so the gate is
          # always exercised on its own edits).
          PATHS=(
            supabase
            supabase-schema.sql
            types
            tools
            .github/workflows/validate.yml
          )

          # Always run on schedule / manual dispatch — those have no meaningful
          # diff base and are exactly when we want the full suite regardless.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Event '$EVENT_NAME' — running Docker-backed jobs unconditionally."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Diff the PR head against the merge-base with its target branch.
            git fetch --quiet --no-tags origin "$BASE_REF"
            RANGE="origin/${BASE_REF}...HEAD"
          else
            # push: diff the pushed range before..after. A brand-new branch (or an
            # unreachable before-sha) has no usable base, so run to be safe.
            ZERO="0000000000000000000000000000000000000000"
            if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "$ZERO" ] \
              || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "No usable before-sha ('${BEFORE_SHA:-}') — running Docker-backed jobs to be safe."
              echo "run_heavy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RANGE="${BEFORE_SHA}..${AFTER_SHA}"
          fi

          echo "Diff range: $RANGE"
          CHANGED="$(git diff --name-only "$RANGE" -- "${PATHS[@]}")"
          if [ -n "$CHANGED" ]; then
            echo "Schema-relevant paths changed:"
            echo "$CHANGED" | sed 's/^/  /'
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No schema-relevant paths changed — skipping Docker-backed jobs."
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run validation suite
        run: npm run validate

  schema-equivalence:
    name: Migration/schema equivalence (GV-175)
    needs: validate
    # `!cancelled()` (not the implicit `success()`) so a red `validate` cannot
    # suppress this suite — GV-394 preserved the independence the old parallel
    # `changes` gate job gave us. See "NOTE ON INDEPENDENCE" on the validate job.
    if: ${{ !cancelled() && needs.validate.outputs.run_heavy == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Replays supabase/migrations/*.sql and supabase-schema.sql into two
      # disposable Postgres 17 databases and diffs the schema dumps — proves the
      # consolidated schema reproduces the migrations' end state (the grep-based
      # guard in test-migrations.mjs cannot see semantic drift).
      - name: Verify schema equivalence
        run: node tools/check-schema-equivalence.mjs

  db-types:
    name: Shared DB/RPC types drift (GV-223)
    needs: validate
    # `!cancelled()` (not the implicit `success()`) so a red `validate` cannot
    # suppress this suite — GV-394 preserved the independence the old parallel
    # `changes` gate job gave us. See "NOTE ON INDEPENDENCE" on the validate job.
    if: ${{ !cancelled() && needs.validate.outputs.run_heavy == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Installs the exact-pinned supabase CLI (devDependency) — the generator
      # byte-compares its output, so the CLI version must not float.
      - name: Install Node dependencies
        run: npm ci

      # --- GV-300: cache the postgres-meta image to dodge public-ECR rate limits ---
      #
      # `supabase gen types typescript` (invoked by tools/generate-db-types.mjs)
      # starts a postgres-meta sidecar container pulled from
      # public.ecr.aws/supabase/postgres-meta:<tag> — Amazon's public ECR
      # rate-limits anonymous pulls, and this job hit `toomanyrequests: Rate
      # exceeded` three times across two days (a false red each time; the
      # generated types were byte-identical). The rate-limit window takes over
      # 12 minutes to reset, so reruns often failed too.
      #
      # No sibling job in this workflow pulls from public.ecr.aws — the other
      # Docker-backed jobs (schema-equivalence, role-matrix, functional-smoke)
      # only use the Docker Hub postgres:17-alpine image (tools/lib/replay-
      # container.mjs), which isn't rate-limited the same way. So only this job
      # needs the cache below.
      #
      # The `<tag>` isn't a literal in our own source — the CLI builds the ref
      # at runtime from a Dockerfile-template string baked into the installed
      # binary. Grepping it out of the just-installed CLI (rather than
      # hardcoding a tag here) means bumping the exact-pinned `supabase`
      # devDependency in package.json automatically changes this ref and
      # invalidates the cache — nothing to keep in sync by hand.
      - name: Resolve pinned postgres-meta image ref
        id: pgmeta
        run: |
          set -euo pipefail
          REF="public.ecr.aws/$(grep -rhoaE 'supabase/postgres-meta:v[0-9]+\.[0-9]+\.[0-9]+' node_modules/@supabase/cli-*/bin/supabase* 2>/dev/null | sort -u | head -1)"
          if [ "$REF" = "public.ecr.aws/" ]; then
            echo "::error::Could not resolve the postgres-meta image ref from the installed supabase CLI binary."
            exit 1
          fi
          echo "Resolved image ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          # actions/cache paths and keys can't contain ':' or '/' — sanitize for
          # the tarball filename and cache key.
          echo "sanitized=$(echo "$REF" | tr '/:' '__')" >> "$GITHUB_OUTPUT"

      - name: Cache postgres-meta image
        id: pgmeta-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pg-meta/${{ steps.pgmeta.outputs.sanitized }}.tar
          key: pgmeta-${{ steps.pgmeta.outputs.sanitized }}

      # Cache hit: load the tarball so `docker run` below finds the image
      # locally and never touches public.ecr.aws.
      - name: Load cached postgres-meta image
        if: steps.pgmeta-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/.cache/pg-meta/${{ steps.pgmeta.outputs.sanitized }}.tar

      # Cache miss: pull once and save a tarball for actions/cache to upload at
      # job end (next run on this ref is a cache hit).
      - name: Pull and save postgres-meta image
        if: steps.pgmeta-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker pull "${{ steps.pgmeta.outputs.ref }}"
          mkdir -p ~/.cache/pg-meta
          docker save -o ~/.cache/pg-meta/${{ steps.pgmeta.outputs.sanitized }}.tar "${{ steps.pgmeta.outputs.ref }}"
      # --- end GV-300 ---

      # Replays supabase-schema.sql into a disposable Postgres 17 and re-runs
      # `supabase gen types typescript`, then byte-compares against the
      # committed types/database.ts. Fails when a schema change merged without
      # regenerating the canonical shared types (npm run gen:db-types).
      - name: Verify committed DB types are fresh
        run: npm run check:db-types

  role-matrix:
    name: RLS role-matrix behavioral suite (GV-248)
    needs: validate
    # `!cancelled()` (not the implicit `success()`) so a red `validate` cannot
    # suppress this suite — GV-394 preserved the independence the old parallel
    # `changes` gate job gave us. See "NOTE ON INDEPENDENCE" on the validate job.
    if: ${{ !cancelled() && needs.validate.outputs.run_heavy == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Replays supabase-schema.sql into a disposable Postgres 17 with a
      # Supabase-faithful prelude (anon/authenticated/service_role, default
      # privileges, auth.jwt()), builds a debtor->creditor fixture through the
      # real RPCs, then runs every financial transition as REAL role/actor
      # combinations and asserts allow/deny + resulting state. Catches
      # behavioural holes (GV-259 cancel sweep, GV-260 amount mismatch) that the
      # structural schema-equivalence check cannot see.
      #
      # NOT --strict, and that is not an oversight: this job checks out fuel_sharing
      # alone, so the GV-379 coverage half ("does any client actually call the
      # functions this guard certifies?") is unanswerable here — --strict would make
      # it permanently red for a question it cannot ask. What it CAN do is say so
      # loudly, which GV-391 made it do: the guard now emits a ::warning:: annotation
      # naming the count it did not verify, and its final line reads "coverage half
      # SKIPPED" instead of an unqualified pass. The strict run, with all three repos
      # checked out, lives in umbrella.yml — that is the only workflow where the
      # sibling repos exist.
      - name: Run role-matrix suite (matrix half only — see umbrella.yml for coverage)
        run: npm run check:role-matrix

  functional-smoke:
    name: Delete-account/push functional smoke (GV-180)
    needs: validate
    # `!cancelled()` (not the implicit `success()`) so a red `validate` cannot
    # suppress this suite — GV-394 preserved the independence the old parallel
    # `changes` gate job gave us. See "NOTE ON INDEPENDENCE" on the validate job.
    if: ${{ !cancelled() && needs.validate.outputs.run_heavy == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Replays supabase-schema.sql into a disposable Postgres 17, seeds a
      # realistic two-ledger dataset, runs delete_my_account()/upsert_push_token()
      # as impersonated JWT users, and asserts every scrub, succession, snapshot
      # rewrite, sole-member cascade, and push-token purge (migrations 056/057).
      # Structural checks (schema-equivalence) can't see this behaviour.
      - name: Run functional smoke test
        run: bash tools/test-functional-smoke.sh

      - name: Run booking-to-trip lifecycle smoke
        run: bash tools/test-booking-trip-functional.sh

      - name: Run atomic booking fuel-completion smoke
        run: bash tools/test-booking-fuel-completion-functional.sh

      - name: Run booking-ended reminder smoke
        run: bash tools/test-booking-reminder-functional.sh

      # GV-405. The fast `validate` job also runs this, but WITHOUT --strict: it skips
      # with a warning where Docker is absent so `npm run validate` keeps its
      # dependency-free promise. Here a skip is a failure — this is the only thing
      # holding migration 154's arithmetic to the mobile TypeScript it duplicates, and a
      # guard that can quietly not run is the guard this project keeps re-learning about.
      - name: Run pre-departure fuel-stop verdict contract
        run: node tools/test-fuel-stop-verdict-contract.mjs --strict

      # GV-472. Same arrangement as the step above: the fast `validate` job runs this
      # without --strict so it can warn where Docker is absent; here a skip is a
      # failure. It is the only thing holding migration 194's two claims — that a
      # zero-km period defers its fuel and nets to exactly zero, and that a period WITH
      # kilometres is byte-for-byte what it was before 194 (measured against a replay of
      # migrations 001–193, not asserted) — and it is also the only place the close-time
      # promotion is exercised against a LOCKED period, which is the state that decides
      # whether the promotion may run before or after the flip to closed.
      - name: Run zero-km fuel carry-forward contract
        run: node tools/test-zero-km-fuel-carryforward-contract.mjs --strict

      # GV-475. Same arrangement again: the fast `validate` job runs this without
      # --strict so it can warn where Docker is absent; here a skip is a failure. It is
      # the only thing holding migration 195's plausibility ceiling to the one promise
      # that matters more than catching the typo — that a TRUE reading is never refused
      # — which needs a real Postgres for both carve-outs (a workspace with no odometer
      # history, and one anchored only by migration 092's tank baseline), and the only
      # place the recompute's deliberate break with 193's monotone mirror is exercised
      # against rows rather than read out of a regex.
      - name: Run handover odometer guard contract
        run: node tools/test-handover-odometer-guard-contract.mjs --strict

      # --strict for the same reason, and for one that is specific to migration 197: its
      # narrow unique_violation handler can only be shown to be narrow by making a real
      # violation happen on a real Postgres, and the retry it must NOT refuse (the offline
      # outbox replaying the same idempotency key) can only be shown by sending it twice.
      - name: Run double-completion guard contract
        run: node tools/test-double-completion-guard-contract.mjs --strict

      # GV-470. Same arrangement once more, and for a reason specific to migration 198:
      # the thing it establishes is that a cancelled-then-retried campaign resumes PAST
      # the batch that already went out, which is five RPC calls of real keyset
      # arithmetic over real subscriber rows — the assertion literally reads the next
      # page back and checks it is not the previous one. A skip here would leave the
      # only executable proof of "no subscriber gets the same campaign twice" unrun.
      - name: Run newsletter cancel-lease contract
        run: node tools/test-newsletter-cancel-lease-contract.mjs --strict

      - name: Run deferred fuel-close smoke
        run: bash tools/test-deferred-fuel-close-functional.sh

      - name: Run payer-deactivation recurring-suspension smoke
        run: bash tools/test-member-recurring-suspension-functional.sh

      - name: Run syn-acknowledgement smoke
        run: bash tools/test-acknowledge-inspection-booking-functional.sh

      # Migration 147's three coupled properties (GV-311/GV-383/GV-392): the dropped
      # RPCs and table are gone AND fuel_ledger_healthcheck stopped enumerating them,
      # delete_my_account still RUNS with push_subscriptions removed underneath it
      # (PL/pgSQL resolves tables at run time, so no structural check sees this), and
      # both replay paths carry one tracker row per migration file — the GV-392
      # regression, where supabase-schema.sql was short three rows and a fresh install
      # booted reporting its own drift.
      - name: Run retired-RPC + tracker-row smoke
        run: bash tools/test-retired-rpcs-functional.sh

      # Migration 149 (GV-385): owner_api_rate_limits must never hold a readable actor
      # again, while still throttling per actor. Schema equivalence proves the two paths
      # agree about the column's SHAPE; only running the limiter shows what goes IN it,
      # and only running as service_role shows that the pepper — the thing that stops
      # the digests being reversed with a list of known addresses — is out of reach.
      # Also covers the two paths the GDPR gap needed: the 30-day sweep and
      # delete_my_account's erasure.
      - name: Run rate-limit pseudonymisation smoke
        run: bash tools/test-rate-limit-pseudonymisation-functional.sh

  drill-smoke:
    name: Restore-drill end-to-end smoke (GV-329)
    needs: validate
    # `!cancelled()` (not the implicit `success()`) so a red `validate` cannot
    # suppress this suite — GV-394 preserved the independence the old parallel
    # `changes` gate job gave us. See "NOTE ON INDEPENDENCE" on the validate job.
    if: ${{ !cancelled() && needs.validate.outputs.run_heavy == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Drives the real tools/restore-drill.mjs against a disposable Postgres with
      # two synthetic dumps (a valid COPY, and one corrupted with a non-integer in
      # an integer column), asserting PASS exits 0 and the corrupt COPY is caught
      # and exits 1 — proving the GV-325 hardening still holds end to end. The
      # smoke FAILS (not skips) here if Docker is missing: GITHUB_ACTIONS is set,
      # so a broken runner surfaces red instead of a false green.
      - name: Run restore-drill smoke test
        run: npm run test:drill-smoke
