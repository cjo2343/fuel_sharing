# Umbrella cross-repo consistency checks (GV-267).
#
# fuel_sharing is the platform repo: it owns the shared Supabase schema and the
# canonical design tokens, but several invariants span all three GoVehlo repos
# (fuel_sharing, govehlo-web, govehlo-mobile). Each repo's own CI only ever sees
# itself, so cross-repo drift — a token hex that diverged, a migration constant
# left un-bumped, a rebranded invite host that only got changed on one side —
# slips through every per-repo pipeline. This workflow checks out all three side
# by side and asserts the invariants that no single repo's CI can.
#
# ---------------------------------------------------------------------------
# TRIGGERS (GV-271)
# ---------------------------------------------------------------------------
# Originally this ran only on fuel_sharing's own pushes to main + a weekly cron,
# which meant a client-only merge (govehlo-web or govehlo-mobile, no fuel_sharing
# change at all) could introduce cross-repo drift with nothing to catch it until
# the next Monday. Both client repos' CI now fire a `repository_dispatch` event
# of type `client-push` when their own main moves (see .github/workflows/
# umbrella-notify.yml in each client repo), so a client merge triggers this
# workflow immediately instead of waiting for the cron.
#
# GV-399: that dispatch has moved twice. It was a `notify-umbrella` job, then GV-394
# folded it into each client's CI job as trailing steps, then GV-399 dropped the
# `push: main` trigger from those CI workflows and gave the dispatch its own tiny
# workflow. If cross-repo checks ever stop firing on a client merge, that file is
# where to look first.
#
# The client-side call needs a token with `repository_dispatch` rights on THIS
# repo — see the UMBRELLA_DISPATCH_TOKEN note in each client repo's
# umbrella-notify.yml for
# what to create and where to save it. If that secret is unset on a client repo,
# its notify job emits a ::warning:: and skips; it never fails that
# repo's CI, and this workflow simply keeps relying on the weekly cron for that
# repo's drift until the token is configured.
#
# GV-391 added `pull_request`. Every trigger above fires AFTER a merge, so this
# workflow could only ever report drift, never prevent it — and it duly did: it was
# red for 18 consecutive runs (govehlo-web's vendored DB types three migrations
# stale) with nothing blocking a single merge in the meantime. A post-hoc guard
# that nobody has to clear is a guard that trains people to ignore red.
#
# GV-424 then split the severity in two. Every multi-repo wave NECESSARILY turns
# this job red on its pull request: the canonical half carries a token, a
# migration or a type generation its sibling MAINS cannot have yet, because the
# sibling halves are still open PRs in the same declared merge set (#217, #220 —
# every such red this repo has seen was predicted in the PR body, none was a
# find). A red that only ever means "mid-rollout, as announced" trains people to
# ignore red just as surely as the pre-GV-391 kind did. So:
#   - pull_request runs are ADVISORY: `continue-on-error` below keeps the full
#     diff in the log and the ::error annotations on the PR, but does not block.
#   - push-to-main, schedule and dispatch runs stay HARD failures. That is the
#     run that fires minutes after a merge and catches the genuinely forgotten
#     sibling half — the GV-391 failure mode — before anything builds on it.
# The release-gates step (GV-422) chose the same two-tier model for the same
# reason; keep the two in step if this policy ever changes.
#
# No `paths:` filter, deliberately. Two reasons, and the second is the decisive one:
#   1. There is no honest filter to write. These checks span design tokens, the
#      migration directory, the invite host and the generated DB types — close to
#      every path this repo has.
#   2. A path-filtered workflow does not merely skip on unrelated PRs, it never
#      REPORTS. Once the owner requires this check (see the gh api command in the
#      GV-391 PR body), a check that never reports leaves the PR pending forever,
#      which gets the requirement removed within a week. A job skipped by an `if:`
#      condition reports as skipped and satisfies the requirement; a workflow
#      filtered out by `paths:` does not. Same reasoning as the GV-283 gate in
#      validate.yml, which gates jobs with `if:` and never with `paths:`.
# The whole run is ~4 minutes (three shallow checkouts plus one Postgres replay),
# so cheap-and-always beats clever-and-sometimes here.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# REQUIRED SECRET: CROSS_REPO_TOKEN
# ---------------------------------------------------------------------------
# govehlo-web and govehlo-mobile are private, so checking them out needs a token
# with cross-repo read access. Create a *fine-grained* Personal Access Token:
#   - Repository access: govehlo-web AND govehlo-mobile (fuel_sharing itself is
#     reachable with the default GITHUB_TOKEN, but granting all three is fine).
#   - Permissions: Contents → Read-only. Nothing else is needed.
# Save it on THIS repo (fuel_sharing) as an Actions secret named
# CROSS_REPO_TOKEN (Settings → Secrets and variables → Actions).
#
# If the secret is absent or revoked, this workflow does NOT fail: the token
# probe (the first step of the single job below) sets an output, the step right
# after it emits a loud ::warning:: annotation, and every check step is skipped.
# A red X on a scheduled cross-repo audit would train everyone to ignore it; a
# visible warning that the audit could not run is the correct signal.
#
# GV-422 — the probe used to LIE, and the fix is why the warning is its own step:
#   The warning text used to live inside the probe's own `run:` block, in the else
#   branch. GitHub echoes the entire `run:` script into the log inside the
#   collapsed ##[group] header before executing a line of it, so
#   "CROSS_REPO_TOKEN is not set … checks were SKIPPED, not run" appeared verbatim
#   in EVERY run's log — including runs where the token was present and all eight
#   checks demonstrably executed two seconds later (see run 30719329737, which
#   prints the skip sentence and "CROSS_REPO_TOKEN present — running cross-repo
#   checks." in the same step). Anyone reading or grepping the log concluded the
#   audit had been skipped when it had run in full.
#
#   Root cause established (2026-08-01): the token is genuinely REQUIRED and
#   genuinely PRESENT. `gh repo view` reports govehlo-web and govehlo-mobile as
#   PRIVATE while fuel_sharing is PUBLIC, so the job's default GITHUB_TOKEN —
#   scoped to fuel_sharing alone — cannot read either sibling; and
#   `gh secret list` shows CROSS_REPO_TOKEN configured on this repo since
#   2026-07-10. So the probe is not removable ("the token is unnecessary" is
#   false), and the contradiction was purely the echoed script body.
#
#   The fix, therefore, is that the sentence lives in a step that RUNS ONLY WHEN
#   THE CHECKS ARE ACTUALLY SKIPPED. A skipped step prints nothing at all — not
#   even its script — so the words "were SKIPPED, not run" can now appear in the
#   log if and only if that is true.
#
# Known limit of the GV-391 `pull_request` trigger: fuel_sharing is public, and a PR
# from a FORK gets no secrets, so the probe sees no token, warns, and the checks
# skip. Branch-internal PRs (every PR this project has had) are unaffected. If fork
# PRs ever become normal here, the fix is `pull_request_target` with an explicit
# checkout of the PR head — which is a security decision, not a plumbing one, so it
# is deliberately not made pre-emptively.
# ---------------------------------------------------------------------------

name: Umbrella cross-repo checks

# Show the triggering client repo + short sha in the run list when this fired
# via repository_dispatch (a client push); fall back to the workflow name for
# every other trigger (schedule, workflow_dispatch, fuel_sharing's own push).
run-name: >-
  ${{ github.event_name == 'repository_dispatch' && format('Umbrella cross-repo checks (triggered by {0}@{1})', github.event.client_payload.repo, github.event.client_payload.sha) || github.workflow }}

on:
  schedule:
    # Weekly, Mondays 06:00 UTC. Cadence is low on purpose — this catches slow
    # drift between repos, it is not a per-PR gate.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
  # GV-391: the only trigger that can gate a merge rather than report after it.
  pull_request:
  repository_dispatch:
    # Fired by govehlo-web / govehlo-mobile's umbrella-notify workflow after a
    # push to their own main lands (see the TRIGGERS note above).
    types: [client-push]

permissions:
  contents: read

# Superseded PR runs are wasted minutes; a force-push should leave one run, not a
# queue. main/schedule/dispatch runs are never cancelled — each of those is auditing
# a distinct state that nothing else will re-check.
concurrency:
  group: umbrella-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  umbrella:
    name: Cross-repo consistency
    runs-on: ubuntu-latest
    # GV-424: advisory on pull requests, hard everywhere else — see the header.
    # A PR in a declared merge set is EXPECTED to disagree with sibling mains;
    # the push-to-main run minutes later is the one that must never be ignored.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      # -----------------------------------------------------------------------
      # Token probe (was its own `preflight` job until GV-394)
      # -----------------------------------------------------------------------
      # Secrets are not available to JOB-level `if:` conditions, which is why
      # this used to be a separate `preflight` job that exposed the answer as an
      # output for a job-level gate. That constraint is real, but the fix was
      # more expensive than the problem: GitHub bills per JOB rounded UP to a
      # whole minute, and this workflow fires a lot — 306 runs in July 2026 (225
      # of them repository_dispatch from the two client repos' merges), and GV-391
      # has just added `pull_request` on top of that. A 2-second
      # `[ -n "$SECRET" ]` test therefore cost 306+ billed minutes a month.
      #
      # STEP-level `if:` has no such restriction on step outputs, so the probe
      # runs as the first step here and every following step gates on it. Same
      # behaviour, one runner instead of two: when the token is missing the
      # checkout and check steps are skipped and the job ends green with the
      # ::warning:: below — a red X on a scheduled cross-repo audit would train
      # everyone to ignore it, so "could not run" must stay a warning.
      #
      # Wall clock is unchanged: preflight ran BEFORE umbrella (a `needs:` edge),
      # so its ~2s was already serial. It is now a ~1s step in the same job.
      #
      # GV-422: this step no longer CONTAINS the skip warning — see the
      # CROSS_REPO_TOKEN section of the header. Its script is echoed into the log
      # verbatim on every run, so any sentence written here is a sentence the log
      # asserts unconditionally, true or not. It now only answers the question;
      # the step below states the consequence, and only when there is one.
      - name: Probe CROSS_REPO_TOKEN
        id: probe
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -n "$CROSS_REPO_TOKEN" ]; then HAS_TOKEN=true; else HAS_TOKEN=false; fi
          echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          # Interpolated, never a literal claim: what the log shows is what was measured.
          echo "CROSS_REPO_TOKEN configured: $HAS_TOKEN"

      # Runs ONLY when the checks are genuinely skipped. A skipped step prints
      # nothing — not even its own script — so this warning appearing in the log
      # is now proof that the audit did not run, rather than boilerplate.
      - name: Warn that cross-repo checks are skipped
        if: steps.probe.outputs.has_token != 'true'
        run: |
          echo "::warning title=Umbrella checks skipped::CROSS_REPO_TOKEN is not set on fuel_sharing — cross-repo drift checks were SKIPPED, not run. Add a fine-grained PAT (Contents: Read on govehlo-web + govehlo-mobile) as the Actions secret CROSS_REPO_TOKEN to enable them."

      # Every step below carries the same gate. Keep it on ALL of them: a step
      # that loses the guard would run without the sibling checkouts present and
      # fail confusingly instead of skipping.
      #
      # Check out all three repos as siblings. check-token-drift.mjs --strict runs
      # from the fuel_sharing checkout and resolves the derived token copies at
      # ../govehlo-web and ../govehlo-mobile, so the directory names and layout
      # below must match those relative paths exactly.
      #   $GITHUB_WORKSPACE/
      #     fuel_sharing/     <- this repo (working-directory for the steps)
      #     govehlo-web/      <- ../govehlo-web
      #     govehlo-mobile/   <- ../govehlo-mobile
      - name: Check out fuel_sharing
        if: steps.probe.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          path: fuel_sharing

      - name: Check out govehlo-web
        if: steps.probe.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: cjo2343/vehloshare-web
          path: govehlo-web
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Check out govehlo-mobile
        if: steps.probe.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: cjo2343/vehloshare-mobile
          path: govehlo-mobile
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Set up Node
        if: steps.probe.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 1. Design-token drift, strict. With all three repos present, a missing or
      #    drifted derived copy is a hard failure (outside the umbrella, a missing
      #    sibling is only a warning — see the header of the script).
      - name: Design-token drift (strict, all three repos)
        if: steps.probe.outputs.has_token == 'true'
        working-directory: fuel_sharing
        run: node tools/check-token-drift.mjs --strict

      # 2. Migration-constant drift. govehlo-web's owner console hard-codes the
      #    latest migration it expects to be applied (EXPECTED_LATEST_MIGRATION);
      #    fuel_sharing/supabase/migrations/ is the source of truth. A migration PR
      #    that forgot to bump the console constant is exactly this mismatch.
      - name: Migration constant vs. highest migration
        if: steps.probe.outputs.has_token == 'true'
        run: |
          set -euo pipefail
          MIG_FILE="govehlo-web/functions/api/owner/migrations.js"
          EXPECTED=$(grep -oE 'EXPECTED_LATEST_MIGRATION[[:space:]]*=[[:space:]]*[0-9]+' "$MIG_FILE" | grep -oE '[0-9]+')
          if [ -z "${EXPECTED:-}" ]; then
            echo "::error::Could not extract EXPECTED_LATEST_MIGRATION from $MIG_FILE"
            exit 1
          fi
          HIGHEST=$(ls fuel_sharing/supabase/migrations/ | grep -oE '^[0-9]{3}' | sort -n | tail -1)
          if [ -z "${HIGHEST:-}" ]; then
            echo "::error::Could not determine the highest migration number in fuel_sharing/supabase/migrations/"
            exit 1
          fi
          echo "EXPECTED_LATEST_MIGRATION (govehlo-web) = $EXPECTED"
          echo "highest migration NNN (fuel_sharing)    = $HIGHEST"
          if [ "$((10#$EXPECTED))" -ne "$((10#$HIGHEST))" ]; then
            echo "::error title=Migration constant drift::govehlo-web EXPECTED_LATEST_MIGRATION ($EXPECTED) does not match the highest migration in fuel_sharing ($HIGHEST). Bump EXPECTED_LATEST_MIGRATION in govehlo-web/functions/api/owner/migrations.js, or land the missing migration."
            exit 1
          fi
          echo "Migration constant is in sync."

      # 3. Invite-host consistency (post-rebrand, GV-262). The mobile invite link
      #    host and the web join route must agree: mobile must build
      #    https://vehloshare.app/join/<code>, and govehlo-web must serve that path.
      - name: Invite-host consistency (mobile link <-> web route)
        if: steps.probe.outputs.has_token == 'true'
        run: |
          set -euo pipefail
          ONBOARDING="govehlo-mobile/src/lib/onboarding.ts"
          if grep -qE 'return `https://vehloshare\.app/join/' "$ONBOARDING"; then
            echo "mobile inviteLink host = vehloshare.app (OK)"
          else
            echo "::error title=Invite host drift::govehlo-mobile inviteLink() in $ONBOARDING does not return the expected https://vehloshare.app/join/ host."
            exit 1
          fi
          JOIN_ROUTE="govehlo-web/functions/join/[code].js"
          if [ -f "$JOIN_ROUTE" ]; then
            echo "web join route present at $JOIN_ROUTE (OK)"
          else
            echo "::error title=Missing web join route::govehlo-web is missing $JOIN_ROUTE, so vehloshare.app/join/<code> links have no handler."
            exit 1
          fi
          echo "Invite host and web join route are consistent."

      # 4. Shared DB/RPC type drift (GV-223). fuel_sharing/types/database.ts is
      #    the canonical artifact, generated from the consolidated schema by
      #    `npm run gen:db-types` (kept fresh by check:db-types in fuel_sharing's
      #    own CI). Each client repo vendors a byte-identical copy at a FIXED
      #    path — these two paths are the phase-2 contract:
      #      govehlo-mobile: src/types/database.generated.ts
      #      govehlo-web:    types/database.ts
      #    (Mobile's path is .generated.ts because src/types/database.ts is a
      #    pre-existing HAND-WRITTEN type file that predates GV-223 — it will
      #    never byte-match the generated artifact and must not arm this check.)
      #    Tolerate-missing mode: until a repo has vendored its copy (GV-223
      #    phase 2), a MISSING file is a ::warning::, not a failure — the
      #    umbrella stays green. A PRESENT copy that differs is real drift and
      #    fails hard.
      #
      #    GV-391 moved the comparison out of inline shell and into
      #    tools/vendor-db-types.mjs, so the SAME tool that reports the drift is the
      #    tool that fixes it (`npm run vendor:db-types`), and the failure message
      #    names that command with both md5s. The 18-run red streak this ticket
      #    closes was not a detection failure — the drift was detected every single
      #    time — it was a remediation-cost failure.
      - name: Shared DB/RPC type drift (GV-223)
        if: steps.probe.outputs.has_token == 'true'
        working-directory: fuel_sharing
        run: node tools/vendor-db-types.mjs --check --strict

      # 5. RLS role-matrix + coverage, STRICT (GV-379 / GV-391). The matrix half runs
      #    in fuel_sharing's own validate.yml, but its coverage half — "does any client
      #    actually call the functions this guard certifies?" — needs the two sibling
      #    repos, which exist in no workflow but this one. Without them the guard
      #    printed "client call sites NOT checked" and exited 0, so the check GV-379
      #    was written to perform had never once performed it. --strict makes an absent
      #    sibling a hard failure, which here means the checkout above broke.
      #
      #    This is the only Docker-backed step in this workflow (a disposable Postgres
      #    replay of supabase-schema.sql); ubuntu-latest runners have Docker
      #    preinstalled, so no setup step is needed. ~35s locally, 166 cases.
      - name: RLS role-matrix + coverage (strict, all three repos)
        if: steps.probe.outputs.has_token == 'true'
        working-directory: fuel_sharing
        run: node tools/test-rls-role-matrix.mjs --strict

      # 6. Load-rehearsal hot-path mirror, STRICT (GV-393). tools/load-rehearsal
      #    replays "what a member's device does" against a throwaway project, so its
      #    query set has to equal govehlo-mobile's ledger-data-gateway.ts. The guard
      #    that claimed to check this compared hotpaths.mjs to its OWN hardcoded copy
      #    of the same constants — a tautology that goes green precisely when the
      #    mirror is wrong, and it had missed two live drifts: a 12-column settlements
      #    projection against the gateway's 17, and a `deleted_at=is.null` filter on
      #    bookings that the gateway deliberately omits (GVM-388). Both made the
      #    rehearsal UNDER-measure, i.e. certify headroom production does not have.
      #
      #    Like the token-drift and role-matrix checks above, it can only compare
      #    against a repo it can see, so this workflow is the only place it is real.
      #    --strict makes an absent sibling a hard failure (= the checkout broke).
      - name: Load-rehearsal hot-path mirror (strict, needs govehlo-mobile)
        if: steps.probe.outputs.has_token == 'true'
        working-directory: fuel_sharing
        run: node tools/check-hotpath-mirror.mjs --strict

      # 7. Every event_type written into public.ledger_events is classified as feed or
      #    audit (GV-413). The bulk of this guard reads only fuel_sharing's own
      #    migrations, so it runs in `npm run validate` and fails on the PR that adds
      #    the migration — a guard that can only report after merge is the failure mode
      #    GV-391 documented at the top of this file.
      #
      #    One live event type is written by govehlo-web rather than by a migration
      #    (operator_data_removed, in the operator console's soft-delete endpoint), so
      #    that half of the scan needs the sibling repo. Locally and in fuel_sharing's
      #    own CI it warns and passes; here --strict makes an absent sibling a hard
      #    failure, and a NEW unclassified event type on the web side turns this red.
      - name: ledger_events feed/audit classification (strict, needs govehlo-web)
        if: steps.probe.outputs.has_token == 'true'
        working-directory: fuel_sharing
        run: node tools/check-ledger-event-classification.mjs --strict

      # 8. The bro/færge crossing split lives twice (GVM-415): in
      #    calculate_period_settlement and in govehlo-mobile's settlement-calc.ts, with
      #    the entry fingerprint's trips component mirrored a third time in
      #    period-snapshot.ts. `npm run validate` runs the SQL half of this and warns
      #    that the mobile half was not checked; only here can it be.
      #
      #    This is a PAIRED merge, and this step is what enforces it: migration 157
      #    changes the fingerprint's trips component from bare ids to ["<id>",<øre>]
      #    pairs, so a client without the mirror cannot close a period at all. Expect
      #    this step red between the platform merge and the mobile merge — that is the
      #    alarm working, exactly as the DB-types step above is red in the same window.
      - name: Crossing split mirror (strict, needs govehlo-mobile)
        if: steps.probe.outputs.has_token == 'true'
        working-directory: fuel_sharing
        run: node tools/test-crossing-split-contract.mjs --strict

      # 9. Release gates, STRICT (GV-422). The known launch blockers — the
      #    unfilled `[DATAANSVARLIG …]` placeholder on the live privacy page, the
      #    Free-plan (= zero backups) posture, a restore drill 25 migrations behind
      #    the schema, and the two externally-attested items — expressed as a script
      #    instead of as prose in DEPLOY-CHECKLIST.md and on GV-104. Gate 1 needs
      #    govehlo-web, so like every step above this workflow is the only place it
      #    is real; the rest read this repo's own evidence files.
      #
      #    EXPECT THIS STEP RED until those items are cleared — that is the ticket,
      #    not a bug. Which is exactly why it does not fail PRs: this workflow runs
      #    on `pull_request` and GV-391 made it a merge gate, and a blocker only the
      #    owner can clear (a paid Supabase plan, a CVR, a human attestation) must
      #    not block an unrelated migration for weeks. So the step always runs
      #    --strict and always prints the full verdict, and `continue-on-error` is
      #    switched on for `pull_request` only: PRs see the annotation, while the
      #    scheduled audit, main and manual runs fail hard. The alternative — a
      #    permanently red required check — gets the requirement removed within a
      #    week, the same argument this file's TRIGGERS note already makes.
      #
      #    Not in `npm run validate` on purpose; see the comment beside the scripts
      #    array in tools/run-validations.mjs.
      - name: Release gates (strict, needs govehlo-web)
        if: steps.probe.outputs.has_token == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        working-directory: fuel_sharing
        run: node tools/check-release-gates.mjs --strict
